<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work.com - Worker Registration</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{background:#fff;border-bottom:1px solid #e6eaf0;padding:18px 7%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:26px;font-weight:800;color:#1769e0}
header a{text-decoration:none;color:#344054;font-weight:700}
.container{max-width:800px;margin:45px auto;padding:0 20px}
.form-card{background:#fff;border-radius:18px;padding:35px;box-shadow:0 10px 30px rgba(20,40,80,.08)}
h1{text-align:center;font-size:34px;margin-bottom:8px}
.intro{text-align:center;color:#667085;margin-bottom:30px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.field{display:flex;flex-direction:column;gap:7px}
.full{grid-column:1/-1}
label{font-weight:700;font-size:14px}
input,select,textarea{width:100%;padding:13px;border:1px solid #d5dce6;border-radius:9px;font-size:15px;background:#fff}
textarea{min-height:110px;resize:vertical}
.submit{width:100%;border:0;background:#1769e0;color:#fff;padding:15px;border-radius:9px;font-size:16px;font-weight:800;cursor:pointer;margin-top:10px}
.note{text-align:center;color:#667085;font-size:13px;margin-top:15px}
footer{text-align:center;background:#101828;color:#cbd5e1;padding:24px;margin-top:45px}
@media(max-width:650px){.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.form-card{padding:25px 20px}.container{margin:25px auto}}
</style>
</head>
<body>
<header>
  <div class="logo">Work.com</div>
  <a href="kaamconnect_homepage.html">← Back to Home</a>
</header>

<main class="container">
  <div class="form-card">
    <h1>Register as a Worker</h1>
    <p class="intro">Create your Work.com profile so customers can find your services.</p>

    <form onsubmit="event.preventDefault(); alert('Registration form submitted! Database connection will be added next.');">
      <div class="form-grid">
        <div class="field">
          <label for="name">Full Name *</label>
          <input id="name" type="text" placeholder="Enter your full name" required>
        </div>

        <div class="field">
          <label for="phone">Mobile Number *</label>
          <input id="phone" type="tel" placeholder="Enter mobile number" required>
        </div>

        <div class="field">
          <label for="profession">Profession *</label>
          <select id="profession" required>
            <option value="">Select profession</option>
            <option>Carpenter</option>
            <option>Electrician</option>
            <option>Plumber</option>
            <option>Mechanic</option>
            <option>Mason</option>
            <option>Painter</option>
            <option>AC Technician</option>
            <option>Other</option>
          </select>
        </div>

        <div class="field">
          <label for="experience">Experience *</label>
          <select id="experience" required>
            <option value="">Select experience</option>
            <option>Less than 1 year</option>
            <option>1–3 years</option>
            <option>4–7 years</option>
            <option>8–10 years</option>
            <option>More than 10 years</option>
          </select>
        </div>

        <div class="field full">
          <label for="location">Location *</label>
          <input id="location" type="text" placeholder="City / District / Area" required>
        </div>

        <div class="field full">
          <label for="services">Services You Offer</label>
          <input id="services" type="text" placeholder="Example: Furniture repair, doors, cupboards">
        </div>

        <div class="field full">
          <label for="photo">Profile Photo</label>
          <input id="photo" type="file" accept="image/*">
        </div>

        <div class="field full">
          <label for="about">About You</label>
          <textarea id="about" placeholder="Tell customers briefly about your work and experience"></textarea>
        </div>
      </div>

      <button class="submit" type="submit">Register on Work.com</button>
      <p class="note">Your registration will be saved to a database when we add the backend.</p>
    </form>
  </div>
</main>

<footer>© 2026 Work.com · Connecting customers with skilled workers</footer>
</body>
</html>
